name: Windows x64 FA4 build
on:
  workflow_dispatch:
  push:
    paths: ['flash_attn/cute/**', 'tests/cute/test_windows*', 'tools/windows*', '.github/workflows/windows-fa4.yml']
  pull_request:
    paths: ['flash_attn/cute/**', 'tests/cute/test_windows*', 'tools/windows*', '.github/workflows/windows-fa4.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install build twine
      # Same PEP 517 backend and package directory as publish-fa4.yml.
      - run: python -m build
        working-directory: flash_attn/cute
      - run: python -m twine check flash_attn/cute/dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-flash-attn-4
          path: flash_attn/cute/dist/*
          if-no-files-found: error
