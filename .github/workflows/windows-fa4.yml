name: Windows native FA4 build
on:
  workflow_dispatch:
  push:
    paths: ['flash_attn/cute/**', 'tests/cute/**', 'tests/windows/**', 'tools/windows*', '.github/workflows/windows-fa4.yml']
  pull_request:
    paths: ['flash_attn/cute/**', 'tests/cute/**', 'tests/windows/**', 'tools/windows*', '.github/workflows/windows-fa4.yml']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            architecture: x64
            python: '3.12'
          - runner: windows-11-arm
            architecture: arm64
            python: '3.13'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.architecture }}
      - run: python -m pip install build twine pytest
      - run: python -m pytest tests/windows -q
      # Same PEP 517 backend and package directory as publish-fa4.yml.
      - run: python -m build
        working-directory: flash_attn/cute
      - run: python -m twine check flash_attn/cute/dist/*
      - run: python tools/windows_artifacts.py --dist flash_attn/cute/dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.architecture }}-flash-attn-4
          path: flash_attn/cute/dist/*
          if-no-files-found: error
