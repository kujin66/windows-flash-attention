name: CI

on:
  pull_request:
    paths: ['flash_attn/cute/**', 'tests/cute/**', 'tests/windows/**', 'tools/windows*', '.github/workflows/**', '.github/actionlint.yaml']
  workflow_dispatch:
    inputs:
      run_windows_arm64_gpu:
        description: Run native Windows ARM64 CUDA validation on the configured runner
        type: boolean
        default: false
      gpu_suite:
        description: GPU suite (full preserves every original input size)
        type: choice
        options: [smoke, full]
        default: smoke
      arm64_runner_label:
        description: Optional unique label for a one-job ARM64 validation runner
        type: string
        default: ''
  push:
    branches: [main, ci-fix]

permissions:
  contents: read

env:
  CI_WORK_DIR: ${{ vars.CI_WORK_DIR || format('/scratch/user/{0}', github.actor) }}
  # The mla_absorbed cases exercise the MLA backward kernels (flash_bwd_mla_sm100.py +
  # dq_dqv + dk); without them CI runs no MLA test at all. We cover the distinct backward
  # paths: sparse (kv_sparsity=True) non-causal + causal, dense (kv_sparsity=False), and
  # shared_kv=True. (deterministic/hdim/mha_type are single-valued for this test.)
  FA4_TEST_FILTER: >-
    1024-1024-128-True-0-0.0-False-False-False-mha-dtype0
    or 1024-1024-128-False-0-0.0-False-False-False-mha-dtype0
    or test_flash_attn_ex2_emu_decode_prefill_consistency
    or test_flash_attn_mla_absorbed and 256-256-False-True-64-False-0-False-False-mqa-dtype0
    or test_flash_attn_mla_absorbed and 256-256-False-True-64-True-0-False-False-mqa-dtype0
    or test_flash_attn_mla_absorbed and 256-256-False-False-64-False-0-False-False-mqa-dtype0
    or test_flash_attn_mla_absorbed and 256-256-True-True-64-False-0-False-False-mqa-dtype0
    or test_cuda_graph

jobs:
  lint:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check flash_attn/cute/ --extend-exclude "flash_attn/cute/flash_bwd.py,flash_attn/cute/flash_fwd.py,flash_attn/cute/flash_fwd_sm100.py,flash_attn/cute/interface.py"
      - name: Ruff format
        run: ruff format --check flash_attn/cute/ --exclude "flash_attn/cute/flash_bwd.py,flash_attn/cute/flash_fwd.py,flash_attn/cute/flash_fwd_sm100.py,flash_attn/cute/interface.py"

  fa4-correctness-and-benchmark:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        gpu: [b200]
    runs-on: [self-hosted, '${{ matrix.gpu }}']
    name: fa4-correctness-and-benchmark (${{ matrix.gpu }})
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        # Only needed to pull the image; skipped when the runner uses a locally built SIF.
        if: ${{ vars.FA4_LOCAL_SIF == '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: ./.github/actions/gpu-test
        with:
          test-filter: ${{ env.FA4_TEST_FILTER }}
          fa4_local_sif: ${{ vars.FA4_LOCAL_SIF }}
          fa4_image_cu129: "togethercomputer/training-performance:flash-attn-cu12.9-26.03.25@sha256:304a5c3d2b3a75b151cd2a964cd26d444e0d8b5686d63943df13378c9705f943"
          fa4_image_cu130: "togethercomputer/training-performance:flash-attn-cu13.0-26.06.27@sha256:2c31843c7137cbe909611eb70a9b6940581a2e3018d2c8b629f84dfd04b9bfd7"

  windows-x64-build:
    name: Windows x64 build and CPU tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install build twine pytest
      - run: python -m pytest tests/windows -q
      - run: python -m build
        working-directory: flash_attn/cute
      - run: python -m twine check flash_attn/cute/dist/*
      - run: python tools/windows_artifacts.py --dist flash_attn/cute/dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-flash-attn-4
          path: flash_attn/cute/dist/*
          if-no-files-found: error

  windows-arm64-build:
    name: Windows ARM64 build and CPU tests
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: arm64
      - run: python -m pip install build twine pytest
      - run: python -m pytest tests/windows -q
      - run: python -m build
        working-directory: flash_attn/cute
      - run: python -m twine check flash_attn/cute/dist/*
      - run: python tools/windows_artifacts.py --dist flash_attn/cute/dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-flash-attn-4
          path: flash_attn/cute/dist/*
          if-no-files-found: error

  windows-arm64-gpu:
    name: Windows ARM64 GPU validation
    needs: windows-arm64-build
    # Never run pull-request code on a local GPU runner.
    if: (github.event_name == 'workflow_dispatch' && inputs.run_windows_arm64_gpu) || (github.event_name == 'push' && vars.FA4_ARM64_GPU_PYTHON != '')
    concurrency:
      group: windows-fa4-arm64-gpu
      cancel-in-progress: false
    runs-on: ${{ inputs.arm64_runner_label || fromJSON('["self-hosted","Windows","ARM64","fa4-gpu"]') }}
    timeout-minutes: ${{ inputs.gpu_suite == 'full' && 1440 || 60 }}
    defaults:
      run:
        shell: pwsh
    env:
      FA4_GPU_SUITE: ${{ inputs.gpu_suite || 'smoke' }}
      FA4_ARM64_GPU_PYTHON: ${{ vars.FA4_ARM64_GPU_PYTHON }}
      FA4_ARM64_GPU_VCVARS: ${{ vars.FA4_ARM64_GPU_VCVARS }}
    steps:
      - name: Set isolated GPU report directory
        run: |
          $reportPath = Join-Path $env:RUNNER_TEMP ('fa4-arm64-ci-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          "FA4_GPU_REPORT=$reportPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Check native ARM64 CUDA environment
        run: |
          if (-not $env:FA4_ARM64_GPU_PYTHON -or -not (Test-Path -LiteralPath $env:FA4_ARM64_GPU_PYTHON)) {
            throw 'Set FA4_ARM64_GPU_PYTHON to a dedicated native ARM64 venv with CUDA dependencies and build/twine/pytest installed.'
          }
          & $env:FA4_ARM64_GPU_PYTHON -c 'import platform, sys, torch; assert sys.platform == "win32" and platform.machine().lower() in ("arm64", "aarch64"); assert sys.prefix != sys.base_prefix, "Dedicated venv required"; assert torch.cuda.is_available(), "CUDA GPU unavailable"; print(torch.cuda.get_device_name()); print(torch.cuda.get_device_capability())'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build installed wheel and run native GPU tests
        run: |
          $loop = @{ Python = $env:FA4_ARM64_GPU_PYTHON; Suite = $env:FA4_GPU_SUITE; WorkDir = $env:FA4_GPU_REPORT }
          if ($env:FA4_ARM64_GPU_VCVARS) { $loop.VcVarsBat = $env:FA4_ARM64_GPU_VCVARS }
          & ./tools/windows-loop.ps1 @loop
          exit $LASTEXITCODE
      - name: Verify completed acceptance
        run: |
          $acceptance = Get-Content -LiteralPath (Join-Path $env:FA4_GPU_REPORT 'acceptance.json') -Raw | ConvertFrom-Json
          if ($acceptance.state -ne 'completed' -or -not $acceptance.passed -or $acceptance.pending_collected -ne 0 -or $acceptance.historical_failed_reports -ne 0) {
            throw 'GPU acceptance is incomplete or contains historical failures; inspect uploaded evidence.'
          }
          if ($env:FA4_GPU_SUITE -eq 'full') {
            & $env:FA4_ARM64_GPU_PYTHON tests/windows/evidence_audit.py $acceptance.source_report
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Upload GPU evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-gpu-${{ env.FA4_GPU_SUITE }}-${{ github.run_attempt }}
          path: |
            ${{ env.FA4_GPU_REPORT }}/**/*.json
            ${{ env.FA4_GPU_REPORT }}/**/*.jsonl
            ${{ env.FA4_GPU_REPORT }}/**/*.xml
            ${{ env.FA4_GPU_REPORT }}/**/*.log
          if-no-files-found: warn
