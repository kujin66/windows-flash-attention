name: Publish flash-attn-4 to PyPI

on:
  push:
    tags:
      - 'fa4-v*'
  schedule:
    - cron: '0 8 * * 3'  # Wednesday 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve-tag.outputs.release_tag }}
    steps:
    - name: Require default branch for manual runs
      if: github.event_name == 'workflow_dispatch'
      run: |
        if [ "${{ github.ref_name }}" != "${{ github.event.repository.default_branch }}" ]; then
          echo "::error::Run this workflow from ${{ github.event.repository.default_branch }} only"
          exit 1
        fi
    - uses: actions/checkout@v4
      if: github.event_name != 'push'
      with:
        ref: ${{ github.event.repository.default_branch }}
        fetch-depth: 0
    - uses: actions/setup-python@v5
      if: github.event_name != 'push'
      with:
        python-version: '3.12'
    - name: Bump beta tag
      if: github.event_name != 'push'
      id: bump
      run: python .github/scripts/bump_beta_tag.py --push
    - name: Resolve release tag
      id: resolve-tag
      run: |
        if [ "${{ github.event_name }}" = "push" ]; then
          echo "release_tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
        else
          echo "release_tag=${{ steps.bump.outputs.next_tag }}" >> "$GITHUB_OUTPUT"
        fi

  build:
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.prepare-release.outputs.release_tag }}
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install build dependencies
      run: pip install build twine
    - name: Extract version from tag
      id: strip-prefix
      run: |
        TAG="${{ needs.prepare-release.outputs.release_tag }}"
        echo "version=${TAG#fa4-v}" >> "$GITHUB_OUTPUT"
    - name: Build package
      run: python -m build
      working-directory: flash_attn/cute
      env:
        SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.strip-prefix.outputs.version }}
    - name: Check package metadata
      run: twine check dist/*
      working-directory: flash_attn/cute
    - name: Store distribution packages
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: flash_attn/cute/dist/

  windows-arm64-validation:
    needs: prepare-release
    permissions:
      contents: read
    name: Windows ARM64 build and CPU tests
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.release_tag }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: arm64
      - run: python -m pip install build twine pytest
      - run: python -m pytest tests/windows -q
      - run: python -m build
        working-directory: flash_attn/cute
      - run: python -m twine check flash_attn/cute/dist/*
      - run: python tools/windows_artifacts.py --dist flash_attn/cute/dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-flash-attn-4
          path: flash_attn/cute/dist/*
          if-no-files-found: error

  windows-arm64-gpu-validation:
    needs: [prepare-release, windows-arm64-validation]
    permissions:
      contents: read
    concurrency:
      group: windows-fa4-arm64-gpu
      cancel-in-progress: false
    runs-on: [self-hosted, Windows, ARM64, fa4-gpu]
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      FA4_GPU_SUITE: smoke
      FA4_ARM64_GPU_PYTHON: ${{ vars.FA4_ARM64_GPU_PYTHON }}
      FA4_ARM64_GPU_VCVARS: ${{ vars.FA4_ARM64_GPU_VCVARS }}
    steps:
      - name: Set isolated GPU report directory
        run: |
          $reportPath = Join-Path $env:RUNNER_TEMP ('fa4-arm64-release-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          "FA4_GPU_REPORT=$reportPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check native ARM64 CUDA environment
        run: |
          if (-not $env:FA4_ARM64_GPU_PYTHON -or -not (Test-Path -LiteralPath $env:FA4_ARM64_GPU_PYTHON)) {
            throw 'Set FA4_ARM64_GPU_PYTHON to a dedicated native ARM64 venv with CUDA dependencies and build/twine/pytest installed.'
          }
          & $env:FA4_ARM64_GPU_PYTHON -c 'import platform, sys, torch; assert sys.platform == "win32" and platform.machine().lower() in ("arm64", "aarch64"); assert sys.prefix != sys.base_prefix, "Dedicated venv required"; assert torch.cuda.is_available(), "CUDA GPU unavailable"; print(torch.cuda.get_device_name()); print(torch.cuda.get_device_capability())'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build installed wheel and run cold/warm GPU smoke
        run: |
          $loop = @{ Python = $env:FA4_ARM64_GPU_PYTHON; Suite = $env:FA4_GPU_SUITE; WorkDir = $env:FA4_GPU_REPORT }
          if ($env:FA4_ARM64_GPU_VCVARS) { $loop.VcVarsBat = $env:FA4_ARM64_GPU_VCVARS }
          & ./tools/windows-loop.ps1 @loop
          exit $LASTEXITCODE
      - name: Verify completed acceptance
        run: |
          $acceptance = Get-Content -LiteralPath (Join-Path $env:FA4_GPU_REPORT 'acceptance.json') -Raw | ConvertFrom-Json
          if ($acceptance.state -ne 'completed' -or -not $acceptance.passed -or $acceptance.pending_collected -ne 0 -or $acceptance.historical_failed_reports -ne 0) {
            throw 'GPU acceptance is incomplete or contains historical failures; inspect uploaded evidence.'
          }
      - name: Upload GPU evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-gpu-smoke-${{ github.run_attempt }}
          path: |
            ${{ env.FA4_GPU_REPORT }}/**/*.json
            ${{ env.FA4_GPU_REPORT }}/**/*.jsonl
            ${{ env.FA4_GPU_REPORT }}/**/*.xml
            ${{ env.FA4_GPU_REPORT }}/**/*.log
          if-no-files-found: warn

  github-release:
    needs: [prepare-release, build, windows-arm64-validation, windows-arm64-gpu-validation]
    runs-on: ubuntu-latest
    steps:
    - name: Download distribution packages
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ needs.prepare-release.outputs.release_tag }}
        files: dist/*
        generate_release_notes: true
        prerelease: ${{ contains(needs.prepare-release.outputs.release_tag, '.beta') }}

  publish-to-pypi:
    needs: [build, windows-arm64-validation, windows-arm64-gpu-validation]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/flash-attn-4
    permissions:
      id-token: write
    steps:
    - name: Download distribution packages
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
